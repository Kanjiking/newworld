<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New World - Games</title>
    <style>
        body {
            font-family: "Courier New", Courier, monospace;
            background-color: #111;
            color: #eee;
            margin: 0;
            padding: 0;
        }
        a {
            color: #ff69b4;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        nav {
            background-color: #222;
            padding: 10px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: space-around;
        }
        nav ul li {
            display: inline;
        }
        nav ul li a {
            color: #eee;
            font-weight: bold;
        }
        .container {
            padding: 20px;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .game-card {
            border: 1px solid #444;
            padding: 20px;
            background-color: #222;
            text-align: center;
        }
        .game-card img {
            max-width: 100%;
            height: auto;
            margin-bottom: 10px;
        }
        .coming-soon {
            border: 1px solid #fff;
            background-color: #fff;
            color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="reviews.html">Reviews</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="games.html">Games</a></li>
        </ul>
    </nav>

    <!-- Games Section -->
    <div class="container">
        <h1>Our Latest Games</h1>
        <div class="games-grid">
            <!-- Project Samita -->
            <div class="game-card">
                <img src="images/projectsamitateaser.png" alt="Project Samita Graphic">
                <h2>Project Samita</h2>
                <p>Visual novel arcade game with dating sim elements.</p>
                <p><strong>Release Date:</strong> Summer 2025</p>
            </div>
            <!-- Placeholder for Future Games -->
            <div class="game-card coming-soon">
                More Coming Soon...
            </div>
        </div>
    </div>
</body>
</html>
